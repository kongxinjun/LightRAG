# Throwaway backends for the differential harness. No volumes: every
# `docker compose down` starts from empty. Ports are offset (+10000 class)
# so they never collide with a developer's real services.
name: lightrag-hunt
services:
  postgres:
    image: gzdaniel/postgres-for-rag:pg18-age-pgvector
    environment:
      POSTGRES_USER: hunt
      POSTGRES_PASSWORD: hunt
      POSTGRES_DB: rag
    ports: ["15432:5432"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/huntpassword
      NEO4J_PLUGINS: '[]'
    ports: ["17687:7687"]
  redis:
    image: redis:8
    ports: ["16379:6379"]
  mongodb:
    hostname: mongodb
    image: mongodb/mongodb-atlas-local:8
    ports: ["27018:27017"]
    # every fault point / example uses a fresh workspace (new collections and
    # search indexes); the default nofile limit crashes mongod mid-sweep
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["16333:6333"]
  memgraph:
    image: memgraph/memgraph:latest
    command: ["--schema-info-enabled=True"]
    ports: ["17688:7687"]
  milvus:
    image: milvusdb/milvus:v2.6.27
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: huntminio
      MINIO_SECRET_ACCESS_KEY: huntminio123
    ports: ["19531:19530"]
    depends_on: [milvus-etcd, milvus-minio]
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
    command: >
      etcd -advertise-client-urls=http://0.0.0.0:2379
      -listen-client-urls=http://0.0.0.0:2379 -data-dir /etcd
  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: huntminio
      MINIO_ROOT_PASSWORD: huntminio123
    command: minio server /minio_data
